<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>豆移し タイムランキング</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;background:#f7f7f9;color:#25232a}.app{width:100%;min-height:100vh;margin:0;padding:18px 18px 32px}.header,.card{background:#fff;border:1px solid #e5e1e5;border-radius:16px;box-shadow:0 4px 18px #2010200d}.header{position:relative;border-top:5px solid #e98bad;text-align:center;padding:20px;margin-bottom:16px}.header h1{margin:0;font-size:clamp(28px,5vw,46px)}.header p{margin:5px 0 0;color:#bd5e80;font-weight:700}.card{padding:18px}.form{display:grid;grid-template-columns:1fr .7fr auto;gap:10px}input,button{font:inherit;min-height:48px;border-radius:10px}input{border:1px solid #d8d3d9;padding:12px;font-size:16px;background:#fafafa}.add{border:0;background:#e98bad;color:#fff;font-weight:800;padding:12px 20px;cursor:pointer}.notice{font-size:12px;color:#888;margin-top:8px}.result{display:none;position:fixed;inset:0;z-index:10000;background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px}.result.show{display:flex}.result-box{width:min(760px,100%);padding:30px}.result-title{font-size:clamp(24px,5vw,42px);font-weight:900;color:#b43f68}.result strong{display:block;font-size:clamp(64px,15vw,130px);line-height:1.1;color:#df5c88;margin:18px 0}.result-time{font-size:clamp(22px,5vw,38px);font-weight:900;color:#333}.result-close{margin-top:35px;border:0;background:#e98bad;color:#fff;font-size:20px;font-weight:900;padding:16px 42px;min-height:58px;border-radius:14px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#f3f1f3;color:#666;font-size:13px;padding:12px 8px}td{text-align:center;padding:13px 8px;border-bottom:1px solid #eee}.rank{font-weight:900;width:90px}.top1{background:#fff8df}.top2{background:#f7f7f7}.top3{background:#fff2ed}.time{font:900 19px Consolas,monospace}.del{border:0;background:#f0ecef;color:#555;padding:7px 10px;min-height:40px;cursor:pointer}.empty{text-align:center;color:#aaa;padding:35px}.side{margin-top:16px}.side p,.side li{font-size:13px;line-height:1.7;color:#666}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:0;background:#eee8eb;color:#555;font-weight:700;cursor:pointer}.danger{background:#e9a0b7!important;color:#fff!important}.stats{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#faf7f9;border:1px solid #eee2e8;border-radius:10px;padding:8px}.stat b{display:block;color:#bd5e80;font-size:18px}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0007;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(410px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 15px 50px #0004}.modalbox h2{margin:0 0 10px}.modalbox p{white-space:pre-line;line-height:1.7;color:#666}.modal-actions{display:flex;gap:9px}.modal-actions button{flex:1;border:0;padding:10px;font-weight:800;cursor:pointer}.cancel{background:#eee;color:#555}.confirm{background:#df7197;color:#fff}@media(max-width:700px){.app{width:calc(100% - 16px);padding-top:14px}.form{grid-template-columns:1fr}.content{margin-top:12px}th,td{padding:10px 4px}.rank{width:72px}.time{font-size:17px}.del{padding:6px 8px}}
.close-app{position:absolute;right:14px;top:14px;border:1px solid #ddd;background:#fff;color:#555;font-weight:800;padding:8px 14px;min-height:40px;border-radius:10px;cursor:pointer}.close-app:hover{background:#f5f5f5}.close-note{display:none;position:fixed;inset:0;background:#fff;z-index:9999;align-items:center;justify-content:center;text-align:center;padding:30px}.close-note.show{display:flex}.close-note-box{max-width:520px}.close-note button{margin-top:15px;border:0;background:#e98bad;color:#fff;padding:12px 24px;border-radius:10px;font-weight:800} @media(max-width:700px){.app{padding:10px 10px 24px}.header{padding:18px 70px 18px 18px}.close-app{right:10px;top:10px}} </style></head><body><div class="app"><header class="header"><h1>🥢 豆移し タイムランキング</h1><p>～ 早さは、正義。～</p></header><section class="card"><form id="form"><div class="form"><input id="name" maxlength="30" placeholder="名前を入力" required><input id="time" inputmode="decimal" placeholder="タイム（例：12.34）" required><button class="add">＋ 追加</button></div></form><div class="notice">タイムは秒で入力してください。例：12.34 → 12秒34</div><div id="result" class="result" aria-live="polite"><div class="result-box"><div class="result-title">🎉 現在の順位</div><div id="resultRank"></div><div id="resultTime" class="result-time"></div><button class="result-close" onclick="closeResult()">✕ 閉じる</button></div></div></section><section class="card content"><table><thead><tr><th>順位</th><th>名前</th><th>タイム</th><th>操作</th></tr></thead><tbody id="ranking"></tbody></table><div class="actions"><button onclick="exportRanking()">ランキングを保存</button><button class="danger" onclick="openClear()">全削除</button></div></section><section class="card side"><div class="stats"><div class="stat">参加者<b id="count">0</b></div><div class="stat">最速<b id="best">--</b></div></div></section></div><div id="modal" class="modal"><div class="modalbox"><h2 id="mtitle">確認</h2><p id="mtext"></p><div class="modal-actions"><button class="cancel" onclick="closeModal()">キャンセル</button><button class="confirm" id="confirm">削除する</button></div></div></div><script>
const KEY="beanRanking_iPad_v4";let data=load(),pending=null;function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(t){return Number(t).toFixed(2)+"秒"}
function render(){data.sort((a,b)=>a.time-b.time);let b=document.getElementById('ranking');if(!data.length)b.innerHTML='<tr><td colspan="4" class="empty">まだ記録がありません</td></tr>';else b.innerHTML=data.map((x,i)=>{let r=i+1,m=r==1?'🥇':r==2?'🥈':r==3?'🥉':'';return `<tr class="${r<=3?'top'+r:''}"><td class="rank">${m} ${r}位</td><td>${esc(x.name)}</td><td class="time">${fmt(x.time)}</td><td><button class="del" onclick="openDelete(${x.id})">削除</button></td></tr>`}).join('');document.getElementById('count').textContent=data.length;document.getElementById('best').textContent=data.length?fmt(data[0].time):'--'}
document.getElementById('form').onsubmit=e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),raw=document.getElementById('time').value.trim().replace(',','.'),time=Number(raw);if(!name||!Number.isFinite(time)||time<=0){alert('名前と正しいタイムを入力してください。');return}let x={id:Date.now()+Math.random(),name,time};data.push(x);data.sort((a,b)=>a.time-b.time);let rank=data.findIndex(v=>v.id===x.id)+1;save();render();e.target.reset();document.getElementById('name').focus();let r=document.getElementById('result');document.getElementById('resultRank').innerHTML=`<strong>${rank}位！</strong>`;document.getElementById('resultTime').textContent=`${name}：${fmt(time)}`;r.classList.add('show')};
function openDelete(id){let x=data.find(v=>v.id===id);if(!x)return;pending=()=>{data=data.filter(v=>v.id!==id);save();render();closeModal()};document.getElementById('mtitle').textContent='記録を削除しますか？';document.getElementById('mtext').textContent='名前：'+x.name+'\nタイム：'+fmt(x.time)+'\n\nこの操作は元に戻せません。';document.getElementById('confirm').textContent='削除する';document.getElementById('modal').classList.add('show')};function openClear(){if(!data.length)return;pending=()=>{data=[];save();render();closeModal()};document.getElementById('mtitle').textContent='ランキングを全削除しますか？';document.getElementById('mtext').textContent='登録されている記録をすべて削除します。\nこの操作は元に戻せません。';document.getElementById('confirm').textContent='全削除する';document.getElementById('modal').classList.add('show')}document.getElementById('confirm').onclick=()=>pending&&pending();function closeModal(){pending=null;document.getElementById('modal').classList.remove('show')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};function closeResult(){document.getElementById("result").classList.remove("show")}function exportRanking(){if(!data.length){alert('記録がありません。');return}let t=['🥢 豆移し タイムランキング','',...data.map((x,i)=>`${i+1}位　${x.name}　${fmt(x.time)}`)].join('\n'),blob=new Blob([t],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='豆移しランキング.txt';a.click()}render();
</script></body></html>
